.status-select.status-delivered{color:#1e2f3f;border-color:#d1dbe8;background:#f8fafc;}
.action-bar{display:flex;gap:12px;padding:12px 16px 18px;background:white;border-top:1px solid #edf2f7;justify-content:space-between;}

#login-section{display:flex;justify-content:center;align-items:center;min-height:500px;}
#login-container{background:white;padding:40px 28px;border-radius:40px;text-align:center;max-width:400px;width:100%;border:1px solid #eef2f6;}
#user-info{display:none;align-items:center;justify-content:space-between;background:white;padding:10px 20px;border-radius:60px;margin-bottom:24px;border:1px solid #eef2f6;}

.button-group{display:flex;flex-direction:column;gap:10px;margin-top:8px;}

<script>
// ==================== КОНФИГУРАЦИЯ ====================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw0RzP7Pp_XQ5h3KibStxSuZ55QnS9s-QvsTST_gQiaQYGSvLQYnpuKcI35XRcvbsxwYg/exec';

const AUTH_SPREADSHEET_ID = '1v-R394u6sKzSdvmkh9qsbqhfkNZEi5lIXwo8BdT_lhQ';
const AUTH_SHEET_NAME = 'PARTS ORDER';
const AUTH_API_KEY = 'AIzaSyAXL0Hsfxy-g-AgYhnivj4x9gCB2rrtF-0';

let currentUser = null;
let currentUserNameFromSheet = null;
let allOrders = [];
let isLoading = false;
let isInitialDataLoaded = false;   // Флаг того, что фоновый запрос уже завершен или активен

// Функция для форматирования даты
function formatDateTime(date) {
    if (!date || !(date instanceof Date) || isNaN(date)) return '—';
    
    const day = String(date.getDate()).padStart(2, '0');
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const year = date.getFullYear();
    const hours = String(date.getHours()).padStart(2, '0');
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const seconds = String(date.getSeconds()).padStart(2, '0');
    
    return `${day}.${month}.${year}, ${hours}:${minutes}:${seconds}`;
}

function showToast(msg, isError) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    toast.style.background = isError ? '#c2410c' : '#1e2f3f';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2800);
}

function callScriptAsync(functionName, data) {
    return new Promise((resolve, reject) => {
        const callbackName = 'cb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
        window[callbackName] = function(response) {
            delete window[callbackName];
            if (response && response.error) reject(new Error(response.error));
            else resolve(response && response.result ? response.result : response);
        };
        const params = new URLSearchParams();
        params.append('fn', functionName);
        if (data) params.append('data', JSON.stringify(data));
        params.append('callback', callbackName);
        const script = document.createElement('script');
        script.src = `${SCRIPT_URL}?${params.toString()}`;
        script.onerror = () => { delete window[callbackName]; reject(new Error('Сетевая ошибка')); };
        document.body.appendChild(script);
        setTimeout(() => {
            if (window[callbackName]) {
                delete window[callbackName];
                reject(new Error('Таймаут запроса'));
            }
        }, 25000);
    });
}

function applyFilters() {
    const statusFilter = document.getElementById('statusFilter').value;
    const clubFilter = document.getElementById('clubFilter').value;
    const searchQuery = document.getElementById('searchInput').value.toLowerCase();
    
    let filteredOrders = [...allOrders];
    
    if (statusFilter === 'active') {
        filteredOrders = filteredOrders.filter(order => order.status === 'Активно' || order.status === 'Активен' || !order.status || order.status === '');
    } else if (statusFilter === 'delivered') {
        filteredOrders = filteredOrders.filter(order => order.status === 'Доставлено');
    }
    
    if (clubFilter !== 'all') {
        filteredOrders = filteredOrders.filter(order => order.club === clubFilter);
    }
    
    if (searchQuery) {
        filteredOrders = filteredOrders.filter(order => 
            (order.partNumber && order.partNumber.toLowerCase().includes(searchQuery)) ||
            (order.club && order.club.toLowerCase().includes(searchQuery))
        );
    }
    
    renderOrders(filteredOrders);
}

// ФУНКЦИЯ ЗАГРУЗКИ В ТИХУЮ (не показывает спиннер, если не запрошено forceShowLoading)
// Возвращает promise, но не обновляет интерфейс принудительно (кроме конечного применения фильтров)
// Используется для фоновой загрузки
async function loadOrdersSilently() {
    if (isLoading) return allOrders;
    isLoading = true;
    
    try {
        const orders = await callScriptAsync('getOrders');
        if (orders && orders.error) throw new Error(orders.error);
        allOrders = Array.isArray(orders) ? orders : [];
        
        // Тихо применяем фильтры и обновляем отображение, но без всплывающих уведомлений и без изменения UI лоадера
        if (document.getElementById('ordersList')) {
            applyFilters();
        }
        
        isInitialDataLoaded = true;
        return allOrders;
    } catch(err) {
        console.error('Тихая загрузка ошибка:', err);
        // При тихой загрузке не показываем тост об ошибке, чтобы не раздражать при перезагрузке, но для отладки можем сохранить
        if (document.getElementById('ordersList') && allOrders.length === 0) {
            // Если данные не загрузились и список пуст — покажем ошибку деликатно
            const container = document.getElementById('ordersList');
            if (container && container.innerHTML.includes('loading-spinner') === false && container.children.length === 0) {
                container.innerHTML = `<div class="empty-state">⚠️ Не удалось загрузить данные. Нажмите "Обновить данные".</div>`;
            }
        }
        return [];
    } finally {
        isLoading = false;
    }
}

// Публичная загрузка с индикацией (принудительное обновление)
// При нажатии на "Обновить данные" данные уже должны быть подгружены тихо, поэтому рендер произойдет мгновенно из кэша allOrders,
// а если по какой-то причине их нет — то тогда выполнится повторный запрос и отобразится спиннер.
async function manualRefresh() {
    // Если данные уже загружены (allOrders не пуст или хотя бы флаг isInitialDataLoaded), показываем их мгновенно
    if (allOrders.length > 0 || isInitialDataLoaded) {
        // Мгновенно применяем фильтры и показываем данные без лишнего запроса.
        // Но чтобы быть уверенным, что данные актуальны, выполняем фоновый запрос без индикации,
        // но при этом интерфейс не моргает. Запрос пойдет в фоне, а пользователь уже видит текущие данные.
        applyFilters();  // сразу показываем то, что есть в кэше
        showToast(`🔄 Отображаются текущие данные (${allOrders.length} заказов), обновление в фоне...`, false);
        
        // Выполняем "тихую" перезагрузку данных, чтобы обновить кэш
        try {
            const freshOrders = await callScriptAsync('getOrders');
            if (freshOrders && !freshOrders.error) {
                allOrders = Array.isArray(freshOrders) ? freshOrders : [];
                applyFilters();
                showToast(`✅ Данные обновлены: ${allOrders.length} заказов`, false);
            } else {
                throw new Error('Пустой ответ');
            }
        } catch(err) {
            console.error('Фоновое обновление не удалось', err);
            showToast(`⚠️ Не удалось обновить, показаны кэшированные данные`, true);
        }
        return;
    }
    
    // Если же данных ещё нет ни разу (крайний случай, например ошибка на старте) — выполняем обычную загрузку с индикатором
    await loadOrders(true);
}

async function saveOrder() {
    const club = document.getElementById('clubSelect').value;
    const partNumber = document.getElementById('partNumber').value.trim();
    const quantity = parseInt(document.getElementById('quantity').value);
    
    if (!club) { showToast('❌ Выберите клуб', true); return; }
    if (!partNumber) { showToast('❌ Введите номер детали', true); return; }
    if (isNaN(quantity) || quantity <= 0) { showToast('❌ Корректное количество', true); return; }
    
    const btn = document.getElementById('saveOrderBtn');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Сохранение...';
    btn.disabled = true;
    
    try {
        const now = new Date();
        
        const result = await callScriptAsync('addOrder', { 
            partNumber, 
            quantity, 
            club,
            timestamp: now.toISOString()
        });
        
        if (result && result.error) throw new Error(result.error);
        
        showToast(`✅ Заказ для ${club}: ${partNumber} (${quantity} шт.) добавлен!`);
        
        document.getElementById('partNumber').value = '';
        document.getElementById('quantity').value = '1';
        document.getElementById('clubSelect').value = '';
        
        // После сохранения — подгружаем новые данные (тихо, без полной перезагрузки интерфейса со спиннером)
        try {
            const updatedOrders = await callScriptAsync('getOrders');
            if (updatedOrders && !updatedOrders.error) {
                allOrders = Array.isArray(updatedOrders) ? updatedOrders : [];
                applyFilters();
            }
        } catch(refErr) {
            // Если тихо не вышло, пробуем принудительную загрузку с индикатором?
            await loadOrders(false);
        }
        
    } catch(err) {
        showToast(`❌ Ошибка: ${err.message}`, true);
    } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
}

async function updateStatus(row, newStatus, selectElement) {
    if (!selectElement) return;
    
    const originalValue = selectElement.value;
    selectElement.disabled = true;
    selectElement.style.opacity = '0.6';
    
    try {
        const result = await callScriptAsync('updateStatus', { row, status: newStatus });
        if (result && result.error) throw new Error(result.error);
        
        const orderIndex = allOrders.findIndex(order => order.row === row);
        if (orderIndex !== -1) {
            allOrders[orderIndex].status = newStatus;
        }
        
        applyFilters();
        
        showToast(`✅ Статус изменён на "${newStatus}"`);
    } catch(err) {
        showToast(`❌ Ошибка: ${err.message}`, true);
        selectElement.value = originalValue;
    } finally {
        selectElement.disabled = false;
        selectElement.style.opacity = '1';
    }
}

async function deleteOrder(row, cardElement) {
    if (!confirm('Удалить заказ навсегда?')) return;
    
    const card = cardElement.closest('.card');
    if (card) {
        card.style.opacity = '0.5';
        card.style.pointerEvents = 'none';
    }
    
    try {
        const result = await callScriptAsync('deleteOrder', { row });
        if (result && result.error) throw new Error(result.error);
        
        const orderIndex = allOrders.findIndex(order => order.row === row);
        if (orderIndex !== -1) {
            allOrders.splice(orderIndex, 1);
        }
        
        applyFilters();
        
        showToast('🗑 Заказ удалён');
    } catch(err) {
        showToast(`Ошибка: ${err.message}`, true);
        if (card) {
            card.style.opacity = '1';
            card.style.pointerEvents = 'auto';
        }
    }
}

function renderOrders(orders) {
    const container = document.getElementById('ordersList');
    if (!container) return;
    
    if (!orders || orders.length === 0) {
        const statusFilter = document.getElementById('statusFilter').value;
        let message = '';
        if (statusFilter === 'active') message = 'Нет активных заказов';
        else if (statusFilter === 'delivered') message = 'Нет доставленных заказов';
        else message = 'Нет заказов';
        
        container.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i> ${message}.</div>`;
        return;
    }
    
    container.innerHTML = '';
    orders.forEach(order => {
        const card = document.createElement('div'); 
        card.className = 'card';
        card.setAttribute('data-row', order.row);
        
        let dateStr = '—';
        if (order.timestamp) {
            try {
                const date = new Date(order.timestamp);
                dateStr = formatDateTime(date);
            } catch(e) {
                dateStr = '—';
            }
        }
        
        const table = document.createElement('table'); 
        table.className = 'order-table';
        
        const currentStatus = order.status || 'Активно';
        
        const rows = [
            { label: 'Номер детали', value: order.partNumber || '—' },
            { label: 'Количество', value: `${order.quantity} шт.` },
            { label: 'Боулинг-клуб', value: order.club || '—' },
            { label: 'Дата и время заказа', value: dateStr }
        ];
        
        rows.forEach(r => {
            const tr = document.createElement('tr');
            const tdL = document.createElement('td'); 
            tdL.textContent = r.label;
            const tdV = document.createElement('td');
            tdV.textContent = r.value;
            tr.appendChild(tdL); 
            tr.appendChild(tdV);
            table.appendChild(tr);
        });
        
        const statusTr = document.createElement('tr');
        const statusTdL = document.createElement('td');
        statusTdL.textContent = 'Статус';
        const statusTdV = document.createElement('td');
        
        const select = document.createElement('select');
        select.className = `status-select ${currentStatus === 'Доставлено' ? 'status-delivered' : 'status-pending'}`;
        select.innerHTML = `
            <option value="Активно" ${currentStatus === 'Активно' ? 'selected' : ''}>🟠 Активно</option>
            <option value="Доставлено" ${currentStatus === 'Доставлено' ? 'selected' : ''}>✅ Доставлено</option>
        `;
        select.onchange = (e) => {
            e.stopPropagation();
            updateStatus(order.row, select.value, select);
        };
        
        statusTdV.appendChild(select);
        statusTr.appendChild(statusTdL);
        statusTr.appendChild(statusTdV);
        table.appendChild(statusTr);
        
        card.appendChild(table);
        
        const actionDiv = document.createElement('div'); 
        actionDiv.className = 'action-bar';
        const deleteBtn = document.createElement('button'); 
        deleteBtn.textContent = '🗑 Удалить'; 
        deleteBtn.className = 'action-btn delete-btn';
        deleteBtn.onclick = () => deleteOrder(order.row, card);
        actionDiv.appendChild(deleteBtn);
        card.appendChild(actionDiv);
        container.appendChild(card);
    });
}

function escapeHtml(str) { 
    if(!str) return ''; 
    return String(str).replace(/[&<>]/g, function(m){
        if(m==='&') return '&amp;'; 
        if(m==='<') return '&lt;'; 
        if(m==='>') return '&gt;'; 
        return m;
    }); 
}

    return new Promise((resolve, reject) => { 
        gapi.load('client', { callback: resolve, onerror: reject, timeout: 10000 }); 
    }); 
}

function handleCredentialResponse(response) {
    try {
        const payload = parseJwt(response.credential);
        currentUser = { email: payload.email.toLowerCase().trim(), name: payload.name, picture: payload.picture };
        showLoadingAuth(true);
        initAndCheckEmail();
    } catch(e) { 
        showLoadingAuth(false); 
        alert('Ошибка входа'); 
    }
}

function showLoadingAuth(show) {
    const container = document.getElementById('login-container');
    if (show && container) {
        if (!container.hasAttribute('data-original')) container.setAttribute('data-original', container.innerHTML);
        container.innerHTML = '<div style="padding:40px;"><div class="loading-spinner"></div><br>Проверка доступа...</div>';
    } else if (container && container.getAttribute('data-original')) {
        container.innerHTML = container.getAttribute('data-original');
        if (window.google?.accounts?.id) {
            google.accounts.id.renderButton(document.querySelector('.g_id_signin'), { 
                type:'standard', shape:'pill', theme:'outline', text:'signin_with', size:'large' 
            });
        }
    }
}

async function initAndCheckEmail() {
    try {
        await loadSheetsAPI();
        await gapi.client.init({ apiKey: AUTH_API_KEY, discoveryDocs: ['https://sheets.googleapis.com/$discovery/rest?version=v4'] });
        await checkEmailAndSiteInSheet(currentUser.email);
    } catch(err) { 
        showLoadingAuth(false); 
        alert('Ошибка API: ' + err.message); 
    }
}

async function checkEmailAndSiteInSheet(email) {
    try {
        const resp = await gapi.client.sheets.spreadsheets.values.get({ 
            spreadsheetId: AUTH_SPREADSHEET_ID, 
            range: `${AUTH_SHEET_NAME}!A:C` 
        });
        const rows = resp.result.values || [];
        let hasAccess = false, foundName = null;
        for (let row of rows) {
            if (!row[0]) continue;
            if (row[0].toLowerCase().trim() === email) { 
                hasAccess = true; 
                if(row[1]) foundName = row[1]; 
                break; 
            }
        }
        if (hasAccess) {
            currentUserNameFromSheet = foundName || currentUser.name;
            loginUser(currentUser);
        } else { 
            showLoadingAuth(false); 
            alert('Нет доступа! Ваш email не авторизован.'); 
        }
    } catch(e) { 
        showLoadingAuth(false); 
        alert('Ошибка проверки таблицы: ' + e.message); 
    }
}

async function loginUser(user) {
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('user-info').style.display = 'flex';
    document.getElementById('main-content').style.display = 'block';
    document.getElementById('user-pic').src = user.picture;
    document.getElementById('user-name').innerText = currentUserNameFromSheet || user.name;
    document.getElementById('user-email').innerText = user.email;
    
    localStorage.setItem('userLoggedIn', 'true');
    localStorage.setItem('userEmail', user.email);
    localStorage.setItem('userName', user.name);
    localStorage.setItem('userPic', user.picture);
    
    // ПОСЛЕ ВХОДА - ЗАГРУЖАЕМ ДАННЫЕ ТИХО (без спиннера на основном блоке)
    const ordersContainer = document.getElementById('ordersList');
    if (ordersContainer) {
        ordersContainer.innerHTML = '<div class="empty-state"><div class="loading-spinner"></div><br>Тихая загрузка данных...</div>';
    }
    // Фоновый запрос без всплывающих тостов
    try {
        await loadOrdersSilently();
    } catch(err) {
        if (ordersContainer) {
            ordersContainer.innerHTML = '<div class="empty-state">⚠️ Ошибка загрузки. Нажмите "Обновить данные".</div>';
        }
    }
}

function parseJwt(token) {
    try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g,'+').replace(/_/g,'/');
        return JSON.parse(decodeURIComponent(atob(base64).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));
    } catch(e){ 
        return {}; 
    }
}

function signOut() { 
    localStorage.clear(); 
    if(google?.accounts?.id) google.accounts.id.disableAutoSelect(); 
    location.reload(); 
}

window.addEventListener('load', async () => {
    const logged = localStorage.getItem('userLoggedIn') === 'true';
    const savedEmail = localStorage.getItem('userEmail');
    
    if (logged && savedEmail) {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('user-info').style.display = 'flex';
        document.getElementById('main-content').style.display = 'block';
        document.getElementById('user-pic').src = localStorage.getItem('userPic') || '';
        document.getElementById('user-name').innerText = localStorage.getItem('userName') || 'User';
        document.getElementById('user-email').innerText = savedEmail;
        
        currentUser = { 
            email: savedEmail, 
            name: localStorage.getItem('userName'), 
            picture: localStorage.getItem('userPic') 
        };
        
        try {
            await loadSheetsAPI();
            await gapi.client.init({ apiKey: AUTH_API_KEY, discoveryDocs: ['https://sheets.googleapis.com/$discovery/rest?version=v4'] });
            
            const resp = await gapi.client.sheets.spreadsheets.values.get({ 
                spreadsheetId: AUTH_SPREADSHEET_ID, 
                range: `${AUTH_SHEET_NAME}!A:C` 
            });
            const rows = resp.result.values || [];
            let hasAccess = false;
            for (let row of rows) {
                if (row[0] && row[0].toLowerCase().trim() === savedEmail.toLowerCase().trim()) { 
                    hasAccess = true; 
                    break; 
                }
            }
            
            if (hasAccess) {
                // ТИХАЯ ЗАГРУЗКА при перезагрузке
                const container = document.getElementById('ordersList');
                if (container) {
                    container.innerHTML = '<div class="empty-state"><div class="loading-spinner"></div><br>Загрузка данных...</div>';
                }
                await loadOrdersSilently();
            } else {
                showToast('❌ Нет доступа к таблице', true);
                document.getElementById('ordersList').innerHTML = '<div class="empty-state">⛔ Нет доступа к таблице</div>';
            }
        } catch(err) {
            console.error('Ошибка инициализации:', err);
            document.getElementById('ordersList').innerHTML = `<div class="empty-state">⚠️ Ошибка подключения: ${err.message}<br><br><button onclick="manualRefresh()" style="margin-top:15px;width:auto;padding:8px 20px;"><i class="fas fa-sync-alt"></i> Попробовать снова</button></div>`;
        }
    } else {
        document.getElementById('login-section').style.display = 'flex';
        if (google?.accounts?.id) {
            google.accounts.id.initialize({ 
                client_id: '328749588235-bgfeukqogpoq2ha65j7j0vk840hctiaq.apps.googleusercontent.com', 
                callback: handleCredentialResponse 
            });
            google.accounts.id.renderButton(document.querySelector('.g_id_signin'), { 
                type:'standard', shape:'pill', theme:'outline', text:'signin_with', size:'large' 
            });
        }
    }
});
