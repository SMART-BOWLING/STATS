        <script>
const API_URL = "https://script.google.com/macros/s/AKfycbxJZEfppSo6QZpmpiEDR1FaOpIjHdfQDXdj-x80uoIy-SU30nKgIgfvr3DNgQbroi53/exec";

const SHEET_ID = "188jMHUJs1KkmCAzG7XZYTnTY9SnNIx0JlXJoEdMTees";

const Sheets = {
    TTL_MS: 2 * 60 * 1e3,
    MISSING_TTL_MS: 10 * 1e3,
    _mem: new Map,
    _fresh: v => Date.now() - v.t < (v.data === null ? Sheets.MISSING_TTL_MS : Sheets.TTL_MS),
    _cached(name) {
        const hit = Sheets._mem.get(name);
        if (hit && Sheets._fresh(hit)) return hit;
        try {
            const raw = sessionStorage.getItem("csports:sheet:" + name);
            if (raw) {
                const v = JSON.parse(raw);
                if (Sheets._fresh(v)) {
                    Sheets._mem.set(name, v);
                    return v;
                }
            }
        } catch (e) {}
        return null;
    },
    _store(name, data) {
        const v = {
            t: Date.now(),
            data: data
        };
        Sheets._mem.set(name, v);
        try {
            sessionStorage.setItem("csports:sheet:" + name, JSON.stringify(v));
        } catch (e) {}
    },
    _clear() {
        Sheets._mem.clear();
        try {
            Object.keys(sessionStorage).filter(k => k.startsWith("csports:sheet:")).forEach(k => sessionStorage.removeItem(k));
        } catch (e) {}
    },
    async _get(params) {
        const url = new URL(API_URL);
        url.searchParams.set("sheetId", SHEET_ID);
        Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
        const json = await (await fetch(url)).json();
        if (!json.success) throw new Error(json.error);
        return json.data;
    },
    async select(sheetName) {
        const hit = Sheets._cached(sheetName);
        if (hit) {
            if (hit.data === null) throw new Error("Table does not exist");
            return hit.data;
        }
        let data;
        try {
            data = await Sheets._get({
                sheetName: sheetName
            });
        } catch (e) {
            if (/does not exist/i.test(e.message)) Sheets._store(sheetName, null);
            throw e;
        }
        Sheets._store(sheetName, data);
        return data;
    },
    async prefetch(names) {
        const todo = [ ...new Set(names) ].filter(n => !Sheets._cached(n));
        if (!todo.length) return;
        try {
            const all = await Sheets._get({
                sheetNames: JSON.stringify(todo)
            });
            if (!all || typeof all !== "object" || Array.isArray(all)) throw new Error("no batch");
            todo.forEach(n => Sheets._store(n, all[n] === undefined ? null : all[n]));
        } catch (e) {
            await Promise.all(todo.map(n => Sheets.select(n).catch(() => {})));
        }
    },
    async bootstrap() {
        const names = [ "TEAMS", "PLAYERS", "LOGOS", "MAPS" ];
        try {
            const t = localStorage.getItem("csports:tournament");
            if (t) names.push(`Результати ${t}`);
        } catch (e) {}
        await Sheets.prefetch(names);
    },
    async post(payload) {
        Sheets._clear();
        const res = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                ...payload,
                sheetId: SHEET_ID
            })
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        return json.data;
    },
    upsert: (sheetName, keyMatchValue, rowData) => Sheets.post({
        operation: "UPSERT",
        sheetName: sheetName,
        keyColumnIndex: 0,
        keyMatchValue: keyMatchValue,
        rowData: rowData
    }),
    async upsertMany(sheetName, rows, headers) {
        try {
            const r = await Sheets.post({
                operation: "UPSERT_MANY",
                sheetName: sheetName,
                keyColumnIndex: 0,
                rows: rows,
                headers: headers
            });
            if (r && typeof r.updated === "number") return r;
        } catch (e) {
            if (!/does not exist/i.test(e.message)) throw e;
        }
        if (headers) await Sheets.ensureTable(sheetName, headers);
        for (const row of rows) await Sheets.upsert(sheetName, row[0], row);
        return {
            updated: rows.length,
            inserted: 0
        };
    },
    insert: (sheetName, rows) => Sheets.post({
        operation: "INSERT",
        sheetName: sheetName,
        rows: rows
    }),
    createTable: (sheetName, headers) => Sheets.post({
        operation: "CREATE_TABLE",
        sheetName: sheetName,
        headers: headers
    }),
    async ensureTable(sheetName, headers) {
        try {
            await Sheets.createTable(sheetName, headers);
        } catch (e) {
            if (/already exists/i.test(e.message)) return;
            try {
                Sheets._clear();
                await Sheets.select(sheetName);
            } catch (e2) {
                throw e;
            }
        }
    }
};

if (typeof module !== "undefined") module.exports = Sheets;
</script>

    w: 19,
    on: true
} ];

const shownColumns = () => COLUMNS.filter(c => c.on);

function loadColumnPrefs() {
    try {
        const saved = JSON.parse(localStorage.getItem("mapstats_columns") || "null");
        if (Array.isArray(saved)) COLUMNS.forEach(c => c.on = saved.includes(c.key));
    } catch (e) {}
}

function renderColumnChecks() {
    const box = $("#columnChecks").empty();
    COLUMNS.forEach(c => {
        const input = $('<input type="checkbox">').prop("checked", c.on);
        input.on("change", () => {
            c.on = input.prop("checked");
            try {
                localStorage.setItem("mapstats_columns", JSON.stringify(shownColumns().map(x => x.key)));
            } catch (e) {}
            renderBoard();
        });
        box.append($("<label>").append(input, document.createTextNode(c.label)));
    });
}

function renderTableHead() {
    const cols = shownColumns();
    const total = cols.reduce((s, c) => s + c.w, 0) || 1;
    const score = cols.length > 9 ? 6 : cols.length > 8 ? 7 : 10;
    const team = cols.length > 9 ? 19 : cols.length > 7 ? 21 : 26;
    const room = 100 - score - team;
    const crowd = cols.length > 9 ? "many" : cols.length > 7 ? "some" : "";
    if (crowd) $("#board").attr("data-cols", crowd); else $("#board").removeAttr("data-cols");
    [ 1, 2 ].forEach(n => {
        const group = $(`#cols${n}`).empty().append(`<col style="width:${score}%">`, `<col style="width:${team}%">`);
        const head = $(`#head${n}`);
        head.children().slice(2).remove();
        cols.forEach(c => {
            group.append(`<col style="width:${(room * c.w / total).toFixed(2)}%">`);
            head.append($("<th>").text(c.label));
        });
    });
}

let tables = {
    LOGOS: [],
    MAPS: [],
    TEAMS: []
};

let currentParse = null;

$(document).ready(async function() {
    loadColumnPrefs();
    renderColumnChecks();
    const savedDay = localStorage.getItem("mapstats_day");
    if (savedDay) {
        $("#dayInput").val(savedDay);
    }
    for (let idx = 1; idx <= 30; idx++) {
        $("#dayInput").append(`<option value="${idx}">${idx}</option>`);
    }
    await loadAllSheets();
    handleUpdate();
});

async function loadAllSheets() {
    showStatus("Загрузка баз данных...", "info");
    try {
        await Sheets.bootstrap();
        const [logos, maps, teams] = await Promise.all([ Sheets.select("LOGOS"), Sheets.select("MAPS"), Sheets.select("TEAMS") ]);
        tables = {
            LOGOS: logos.slice(1) || [],
            MAPS: maps.slice(1) || [],
            TEAMS: teams.slice(1) || []
        };
        $("#tournamentList").html("");
        $("#tournamentInput")[0].value = tables.LOGOS.at(-1)[0];
        $("#logoRightInput")[0].value = tables.LOGOS.at(-1)[1];
        tables.LOGOS.reverse().forEach(r => {
            if (r[0] !== "CSPORTS_LOGO") $("#tournamentList").append(`<option value="${r[0]}"></option>`);
        });
        $("#mapInput").html("");
        tables.MAPS.forEach(r => $("#mapInput").append(`<option value="${r[0]}">${r[0]}</option>`));
        $("#mapInput").append('<option value="TOTAL">TOTAL (все карты)</option>');
        const csLogo = tables.LOGOS.find(r => r[0] === "CSPORTS_LOGO");
        if (csLogo) $("#logoLeft").attr("src", csLogo[1]);
        showStatus("Базы данных успешно загружены!", "success");
    } catch (e) {
        showStatus("Ошибка загрузки БД: " + e.message, "error");
    }
}

    localStorage.setItem("mapstats_day", $(this).val());
});

async function handleUpdate() {
    const rawData = $("#inputData").val().trim();
    if (!rawData) {
        currentParse = {
            team1Name: "Team 1",
            team2Name: "Team 2",
            team1Players: [],
            team2Players: []
        };
        const empty = () => ({
            name: "",
            stats: {
                k: "0",
                a: "0",
                d: "0",
                adr: "",
                kast: "",
                rating: "",
                swing: "",
                kd: "",
                opkd: "",
                mks: "",
                clutch: ""
            }
        });
        while (currentParse.team1Players.length < 5) currentParse.team1Players.push(empty());
        while (currentParse.team2Players.length < 5) currentParse.team2Players.push(empty());
        renderBoard();
        return;
    }
    currentParse = parseData(rawData);
    await enforceTeamModal(currentParse.team1Name);
    await enforceTeamModal(currentParse.team2Name);
    renderBoard();
}

function parseData(rawText) {
    const text = rawText.replace(/\u00A0/g, " ").replace(/\(.*?\)/g, " ").replace(/[%]/g, " ").replace(/:/g, " ").replace(/[\r\n\t]+/g, " ").replace(/\s{2,}/g, " ").trim();
    const fmt2 = /(?<name>[A-Za-z0-9_.-]{1,20})\s+(?<opk>\d+)\s+(?<opd>\d+)\s+(?<mks>\d+)\s+(?<kast>\d+\.\d+)\s+(?<clutch>\d+)\s+(?<k>\d+)\s+(?<a>\d+)\s+(?<d>\d+)\s+(?<adr>\d+\.\d+)(?:\s+(?<swing>[-+]?\d+(?:\.\d+)?))?\s+(?<rating>\d+\.\d+)/g;
    const fmt1 = /(?<name>[A-Za-z0-9_.-]{1,20})\s+(?<k>\d+)\s+(?<a>\d+)\s+(?<d>\d+)\s+(?<adr>\d+\.\d+)\s+(?<kast>\d+\.\d+)(?:\s+(?<swing>[-+]?\d+(?:\.\d+)?))?\s+(?<rating>\d+\.\d+)/g;
    let players = [], match;
    while ((match = fmt2.exec(text)) !== null) players.push({
        ...match.groups,
        index: match.index,
        end: match.index + match[0].length
    });
    if (players.length === 0) while ((match = fmt1.exec(text)) !== null) players.push({
        ...match.groups,
        index: match.index,
        end: match.index + match[0].length
    });
    let team1Name = "Team 1", team2Name = "Team 2";
    const cleanTeam = str => {
        let name = str.trim();
        const half = Math.floor(name.length / 2);
        return half > 0 && name.substring(0, half) === name.substring(half) ? name.substring(0, half) : name;
    };
    if (players.length > 0) team1Name = cleanTeam(text.substring(0, players[0].index).split(/Op\.|K-D|\bK\b\s+\bA\b\s+\bD\b/)[0]) || "Team 1";
    if (players.length >= 6) team2Name = cleanTeam(text.substring(players[4].end, players[5].index).split(/Op\.|K-D|\bK\b\s+\bA\b\s+\bD\b/)[0]) || "Team 2";
    const result = {
        team1Name: team1Name,
        team2Name: team2Name,
        team1Players: [],
        team2Players: []
    };
    const formatP = p => ({
        name: p.name,
        stats: {
            k: parseInt(p.k),
            a: parseInt(p.a),
            d: parseInt(p.d),
            adr: parseFloat(p.adr).toFixed(1),
            kast: parseFloat(p.kast).toFixed(1) + "%",
            rating: parseFloat(p.rating).toFixed(2),
            opkd: p.opk === undefined ? "" : `${p.opk}:${p.opd}`,
            mks: p.mks === undefined ? "" : String(parseInt(p.mks)),
            clutch: p.clutch === undefined ? "" : String(parseInt(p.clutch)),
            swing: p.swing === undefined ? "" : (parseFloat(p.swing) > 0 ? "+" : "") + parseFloat(p.swing) + "%"
        }
    });
    result.team1Players = players.slice(0, 5).map(formatP);
    result.team2Players = players.slice(5, 10).map(formatP);
    const empty = () => ({
        name: "",
        stats: {
            k: "0",
            a: "0",
            d: "0",
            adr: "",
            kast: "",
            rating: "",
            swing: "",
            kd: "",
            opkd: "",
            mks: "",
            clutch: ""
        }
    });
    while (result.team1Players.length < 5) result.team1Players.push(empty());
    while (result.team2Players.length < 5) result.team2Players.push(empty());
    return result;
}

function renderBoard() {
    $("#tournamentName").text($("#tournamentInput").val());
    $("#logoRight").attr("src", $("#logoRightInput").val());
    $("#score1").text($("#score1Input").val());
    $("#score2").text($("#score2Input").val());
    $("#mapName").text($("#mapInput").val());
    const mapRow = tables.MAPS.find(r => r[0] === $("#mapInput").val());
    if (mapRow) {
        $("#mapOverlay").css("background-image", `url('${mapRow[1]}')`).show();
    } else {
        $("#mapOverlay").hide();
    }
    renderTableHead();
    renderTeam("team1", currentParse.team1Name, currentParse.team1Players);
    renderTeam("team2", currentParse.team2Name, currentParse.team2Players);
}

function renderTeam(prefix, fullName, players) {
    let tName = fullName, tLogo = "";
    const tRow = tables.TEAMS.find(r => r[0].toLowerCase() === fullName.toLowerCase());
    if (tRow) {
        if (tRow[1]) tName = tRow[1];
        if (tRow[2]) tLogo = tRow[2];
    }
    const $header = $(`#${prefix}Header`).empty();
    const $div = $("<div>").addClass("team-cell");
    if (tLogo) $div.append($("<img>").attr("src", tLogo).addClass("team-logo-img"));
    $div.append($("<span>").text(tName));
    $header.append($div);
    const $body = $(`#${prefix}Body`).empty();
    players.forEach(p => {
        const ratingNum = parseFloat(p.stats.rating);
        const ratingClass = isNaN(ratingNum) ? "" : ratingNum >= 1 ? "rating-high" : "rating-low";
        const cells = shownColumns().map(c => {
            const v = c.get ? c.get(p.stats) : p.stats[c.key];
            return `<td${c.key === "rating" ? ` class="${ratingClass}"` : ""}>${v === undefined ? "" : v}</td>`;
        }).join("");
        $body.append(`<tr><td colspan="2" class="team-name"><div class="team-cell"><span>${p.name}</span></div></td>${cells}</tr>`);
    });
}

async function enforceTeamModal(teamName) {
    if (!teamName || teamName === "Team 1" || teamName === "Team 2") return;
    if (tables.TEAMS.find(r => r[0].toLowerCase() === teamName.toLowerCase())) return;
    $("#modalTeamNameLabel").text(teamName);
    $("#teamModal").css("display", "flex");
    $("#saveTeamBtn").off("click").on("click", async function() {
        const sName = $("#modalShortName").val(), url = $("#modalTeamLogo").val();
        await Sheets.upsert("TEAMS", teamName, [ teamName, sName, url ]);
        tables.TEAMS.push([ teamName, sName, url ]);
        $("#teamModal").hide();
        handleUpdate();
    });
}

$("#saveDbBtn").on("click", async function() {
    if (!currentParse) return;
    const $btn = $(this);
    const originalText = $btn.text();
    $btn.text("Сохранение...").prop("disabled", true);
    const tName = $("#tournamentInput").val(), sheetName = `Результати ${tName}`, day = $("#dayInput").val(), map = $("#mapInput").val(), score1 = $("#score1Input").val(), score2 = $("#score2Input").val(), ts = (new Date).toISOString();
    try {
        await Sheets.createTable(sheetName, [ "Player name", "Team name", "Opponent team", "Day", "Map name", "Op.K-D", "MKs", "KAST", "1vsX", "K (hs)", "A (f)", "D (t)", "ADR", "Swing", "Rating3.0", "Created at", "Score", "Opp score" ]);
    } catch (e) {}
    const rows = [];
    currentParse.team1Players.forEach(p => rows.push([ p.name, currentParse.team1Name, currentParse.team2Name, day, map, p.stats.opkd ? "'" + p.stats.opkd : "", p.stats.mks || "", p.stats.kast, p.stats.clutch || "", p.stats.k, p.stats.a, p.stats.d, "'" + p.stats.adr, "", "'" + p.stats.rating, ts, score1, score2 ]));
    currentParse.team2Players.forEach(p => rows.push([ p.name, currentParse.team2Name, currentParse.team1Name, day, map, p.stats.opkd ? "'" + p.stats.opkd : "", p.stats.mks || "", p.stats.kast, p.stats.clutch || "", p.stats.k, p.stats.a, p.stats.d, "'" + p.stats.adr, "", "'" + p.stats.rating, ts, score2, score1 ]));
    try {
        await Sheets.insert(sheetName, rows);
        $btn.text("Сохранено!");
    } catch (e) {
        $btn.text("Ошибка");
    } finally {
        setTimeout(() => {
            $btn.text(originalText).prop("disabled", false);
        }, 1500);
    }
});

function showStatus(msg, type) {
    const $st = $("#statusMessage").text(msg).removeClass("success error info").addClass(type).show();
    setTimeout(() => $st.hide(), 5e3);
}

$("#shareBtn").on("click", async function() {
    try {
        const canvas = await html2canvas(document.getElementById("board"), {
            useCORS: true,
            scale: 2,
            backgroundColor: null,
            onclone: d => d.getElementById("board").style.transform = "none"
        });
        canvas.toBlob(async blob => {
            const file = new File([ blob ], "mapstats.png", {
                type: "image/png"
            });
            if (navigator.canShare && navigator.canShare({
                files: [ file ]
            })) {
                await navigator.share({
                    files: [ file ]
                });
            } else {
                showStatus("Ваш браузер не поддерживает Share API.", "error");
            }
        });
    } catch (e) {
        showStatus("Ошибка при попытке поделиться: " + e.message, "error");
    }
});

function fitMapBoard() {
    const wrap = document.getElementById("boardWrap");
    const board = document.getElementById("board");
    const k = Math.min(1, wrap.clientWidth / 521);
    board.style.transform = `scale(${k})`;
    board.style.transformOrigin = "0 0";
    wrap.style.height = board.offsetHeight * k + "px";
}

new ResizeObserver(fitMapBoard).observe(document.getElementById("boardWrap"));
